{% extends "base.html" %}
{% block title %}Delete {{ singular[kind] }}{% endblock %}
{% block content %}
    <header>
        <h1>{{ self.title() }}</h1>
    </header>
    <form class="panel padded" method="post">
        <input type="hidden" name="token" value="{{ session.token }}">
        <h2>{{ row[columns[kind][0]] }}</h2>
        <p>This will permanently delete this {{ singular[kind] }}.</p>
        {% if error %}
            <p class="error" role="alert">{{ error }}</p>
        {% endif %}
        <div class="actions">
            <button class="danger">Confirm deletion</button>
            <a class="secondary" href="{{ url_for('detail',kind=kind,rid=rid) }}">Cancel</a>
        </div>
    </form>
{% endblock %}
